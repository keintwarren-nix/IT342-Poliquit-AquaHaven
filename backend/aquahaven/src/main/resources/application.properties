# Server
server.port=${PORT:8080}

# PostgreSQL - Render compatibility
# If DATABASE_URL is provided (Render), convert postgresql:// to jdbc:postgresql://
# Otherwise use local settings
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aquahaven_db}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false

# JWT
jwt.secret=${JWT_SECRET:aquahaven-super-secret-key-change-this-in-production-2026}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
